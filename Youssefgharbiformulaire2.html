<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Youssef Gharbi-formulaire.css">
</head>
<body>
    <div><h1>Mon premiere Formulaire Html 5</h1></div>
    <form action="destination.html">
    <fieldset id="main">
        <legend>Vos donnes personnelles</legend>
            <table>
                <tr>
                    <td><label for="">Nom</label></td>
                    <td><input type="text" id="nom" placeholder="votre nom"></td>
                </tr>
                <tr>
                    <td><label for="">prenom</label></td>
                    <td><input type="text" id="prenom" placeholder="votre prenom"></td>
                </tr>
                <tr>
                    <td><label for="">Dare de naissence</label></td>
                    <td><input type="date" id="date"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <fieldset>
                            <legend>Lieu de naissence </legend>
                            <input type="radio" name="" id="">Seine_Saint_Demis
                            <input type="radio" name="" id="">Reste du monde
                        </fieldset>
                    </td>
                </tr>
                <tr>
                    <td><label for="">Adresse postal</label></td>
                    <td><textarea id="Adress postale" placeholder=" votre Adresse postal"></textarea></td>
                </tr>
                <tr>
                    <td><label for="">Code postale</label></td>
                    <td><input type="number" placeholder="9963" max="99999"></td>
                </tr>
                <tr>
                    <td><label for="">Adresse electronique</label></td>
                    <td><input type="email" name="" id="" placeholder="votre Adresse electronique"></td> 
                </tr>
                <tr>
                    <td> <label for="">page personelle</label></td>
                    <td><input type="text" placeholder="votre page web"></td>
                </tr>
                <tr>
                    <td><label for="">telphone portable</label></td>
                    <td><input type="tel" placeholder="12345678" min="0600000000" max="0799999999"></td>
                </tr>
                <tr>
                    <td><label for="">Semstre</label></td>
                    <td><select name="" id="">
                        <option value="">s1</option>
                        <option value="" selected>s2</option>
                        <option value="">s3</option>
                        <option value="">s4</option>
                    </select></td>
                </tr>
                <tr>
                    <td><label for="">Niveau en html</label></td>
                    <td><input type="range"></td>
                </tr>
                <tr>
                    <td colspan="2"><fieldset id="cons">
                        <legend>
                            connaissance
                        </legend>
                        <input type="checkbox" name="" id="" checked >HTLM
                        <input type="checkbox" name="" id="">CSS
                        <input type="checkbox" name="" id="">FORMULAIRE
                        <input type="checkbox" name="" id="">JAVA SCRIPT
                    </fieldset>
                </td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="Envoyer"></td>
                </tr>
            </table>
    </fieldset>
    </form>
    <hr color="bleu"> <p>formulaire realise dans le cadre de tp 2</p>
    <hr color="bleu">
</body>
</html>
</body>
</html>
